<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - MM Luxe Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f4f4;color:#222;padding:0}
.hidden{display:none!important}
.box{max-width:1000px;margin:0 auto;background:#fff;border-radius:12px;padding:20px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:16px}
input,select,textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin:4px 0 10px}
label{font-size:13px;color:#555}
button{border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px;background:#111;color:#fff}
button.green{background:#25d366}
button.red{background:#e5484d}
button.grey{background:#eee;color:#222}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #eee;padding:8px;text-align:left;vertical-align:middle}
td img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.thumbs div{position:relative}
.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.thumbs span{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-size:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
a{color:#25d366}
.admin-layout{display:flex;width:100%;min-height:100vh;padding:0;overflow:hidden;border-radius:0}
.sidebar{width:210px;flex:none;background:#1a1a1a;color:#fff;padding:22px 14px;display:flex;flex-direction:column;align-items:center}
.sidebar img.side-logo{width:64px;height:64px;border-radius:50%;border:3px solid #d4af37;object-fit:cover}
.sidebar .side-name{font-size:16px;font-weight:700;margin-top:10px}
.sidebar .side-sub{font-size:12px;color:#999;letter-spacing:2px;margin:2px 0 20px}
.sidebar nav{width:100%;display:flex;flex-direction:column;gap:6px}
.nav-btn{display:block;width:100%;text-align:left;background:transparent;color:#ddd;border:none;border-radius:8px;padding:11px 14px;cursor:pointer;font-size:14px;text-decoration:none}
.nav-btn:hover{background:#2a2a2a;color:#fff}
.nav-btn.active{background:#25d366;color:#fff;font-weight:700}
.admin-main{flex:1;min-width:0;padding:20px;overflow-x:auto}
@media (max-width:700px){
  .admin-layout{flex-direction:column}
  .sidebar{width:100%;padding:14px;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:center}
  .sidebar img.side-logo{width:44px;height:44px}
  .sidebar .side-name{margin:0}
  .sidebar .side-sub{display:none}
  .sidebar nav{flex-direction:row;flex-wrap:wrap}
  .nav-btn{width:auto}
}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:36px 32px 30px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.login-card img.logo{width:84px;height:84px;border-radius:50%;border:3px solid #d4af37;object-fit:cover;margin-bottom:14px}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card .brand{font-size:13px;letter-spacing:2px;color:#999;margin-bottom:24px}
.login-card label{display:block;text-align:left}
.login-card button{width:100%;padding:12px;font-size:15px;margin-top:6px}
.login-card .foot{margin-top:18px;font-size:12px;color:#bbb}
</style>
</head>
<body>
<div class="login-wrap" id="loginBox">
  <div class="login-card">
    <img class="logo" src="/images/logo.png" alt="MM Luxe Shop">
    <h1>管理后台</h1>
    <p class="brand">MM LUXE SHOP · ADMIN</p>
    <label>账号 Account</label>
    <input id="username" type="text" value="admin01" autocomplete="username">
    <label>密码 Password</label>
    <input id="pw" type="password" placeholder="输入管理员密码" autocomplete="current-password">
    <p id="loginErr" style="color:#e5484d"></p>
    <button id="loginBtn" class="green">登录 Login</button>
    <p class="foot">仅管理员可进入</p>
  </div>
</div>

<div class="box hidden admin-layout" id="adminBox">
  <aside class="sidebar">
    <img class="side-logo" src="/images/logo.png" alt="MM Luxe Shop">
    <div class="side-name">MM Luxe Shop</div>
    <div class="side-sub">管理后台 ADMIN</div>
    <nav>
      <button id="navProducts" class="nav-btn active" type="button">📦 商品管理</button>
      <button id="navStats" class="nav-btn" type="button">📊 访问统计</button>
      <button id="navNew" class="nav-btn" type="button">＋ 新增商品</button>
      <a href="/" target="_blank" class="nav-btn">🛍 查看前台</a>
      <button id="logoutBtn" class="nav-btn" type="button">🚪 退出登录</button>
    </nav>
  </aside>
  <main class="admin-main">
  <div id="viewProducts">
    <div><h1>商品管理</h1><p class="sub">Products — 上传图片 / 上架 / 改价（美元 USD，留空 = 前台不显示价格）</p></div>

  <button id="newBtn" class="green">+ 新增商品 Add Product</button>
  <div style="margin:14px 0 8px;display:flex;gap:8px;align-items:center">
    <input id="adminSearch" type="search" placeholder="搜索商品：名字 / 品牌 / 编号 / 商家…" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px">
    <span id="listCount" style="color:#888;font-size:13px;white-space:nowrap"></span>
  </div>
  <div id="formBox" class="hidden" style="margin-top:16px;border:1px solid #eee;border-radius:10px;padding:16px">
    <h2 id="formTitle" style="font-size:17px;margin-bottom:10px">新增商品</h2>
    <input type="hidden" id="fId">
    <div class="row">
      <div><label>商品名（中文）*</label><input id="fName"></div>
      <div><label>商品名（英文）Name (EN)</label><input id="fNameEn"></div>
    </div>
    <div class="row">
      <div><label>品牌 Brand</label><input id="fBrand" list="brands"><datalist id="brands"><option>Louis Vuitton</option><option>Gucci</option><option>Hermes</option><option>Dior</option><option>Chanel</option><option>Prada</option></datalist></div>
      <div><label>分类 Category</label><select id="fCat"><option value="bags">包包 Bags</option><option value="clothing">衣服 Clothing</option><option value="shoes">鞋子 Shoes</option><option value="accessories">配饰 Accessories</option><option value="jewelry">首饰 Jewelry</option></select></div>
      <div><label>编号 Code *</label><input id="fCode" placeholder="如 1245088195"></div>
      <div><label>价格 USD（美元，留空 = 不显示）</label><input id="fPrice" type="number" min="0" step="0.01" placeholder="留空"></div>
      <div><label>已售件数（前台显示，可改）</label><input id="fSold" type="number" min="0" step="1" placeholder="留空 = 随机"></div>
    </div>
    <div class="row">
      <div><label>成本价 RMB（人民币，仅后台可见）</label><input id="fCostCny" type="number" min="0" step="0.01" placeholder="如 320"></div>
      <div><label>商家联系方式（微信 / 电话，仅后台可见）</label><input id="fSupplier" placeholder="如 微信 xxx / 电话"></div>
      <div><label>商品链接（仅后台可见）</label><input id="fSourceUrl" placeholder="https://gxhy1688.com/detailIndex?..."></div>
    </div>
    <label><input type="checkbox" id="fPublished" checked style="width:auto"> 上架 Published（取消 = 前台看不到）</label>
    <label style="display:block;margin-top:10px">商品图片（可多选：正面 / 侧面 / 细节）</label>
    <input id="fFiles" type="file" accept="image/*" multiple>
    <button id="uploadBtn" class="grey" type="button">上传选中图片 Upload</button>
    <div id="fThumbs" class="thumbs"></div>
    <div style="margin-top:10px">
      <button id="saveBtn" class="green">保存 Save</button>
      <button id="cancelBtn" class="grey">取消</button>
    </div>
  </div>

  <table style="margin-top:18px">
    <thead><tr><th>图片</th><th>商品</th><th>品牌 / 分类</th><th>价格</th><th>成本</th><th>已售</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  </div>
  <div id="viewStats" class="hidden">
    <div><h1>访问统计</h1><p class="sub">每天多少人点进网站、看了哪些商品</p></div>
    <div id="statsBox" style="margin:16px 0;border:1px solid #eee;border-radius:10px;padding:12px 16px">
      <h2 id="statsToggle" style="font-size:17px;cursor:pointer;user-select:none">访问统计 <span id="statsArrow" style="color:#888;font-size:13px">▶ 展开</span></h2>
      <div id="statsBody" class="hidden">
      <div class="row" id="statsCards" style="margin-top:10px"></div>
      <div id="statsChart" style="margin-top:12px"></div>
      <div id="statsTop" style="margin-top:12px;font-size:13px"></div>
      </div>
    </div>
  </div>
  </main>
</div>

<script src="/admin.js"></script>
</body>
</html>
